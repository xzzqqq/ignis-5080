name: remote development

on:
  push:
    paths:
      - '.github/workflows/remote-dev.yml'
      - 'scripts/remote*.py'
      - 'scripts/pre_push.py'
      - '.githooks/pre-push'
      - 'mk/linux/**'
      - 'mk/os/linux.mk'
      - 'tests/test_*.py'
  pull_request:
    paths:
      - '.github/workflows/remote-dev.yml'
      - 'scripts/remote*.py'
      - 'scripts/pre_push.py'
      - '.githooks/pre-push'
      - 'mk/linux/**'
      - 'mk/os/linux.mk'
      - 'tests/test_*.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Gitleaks for hook integration tests
        shell: bash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ignis-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/ignis-tools" gitleaks
          echo "$RUNNER_TEMP/ignis-tools" >> "$GITHUB_PATH"
      - name: Source sync and daemon lifecycle (CPU only)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
