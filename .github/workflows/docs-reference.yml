name: docs-reference

on:
  push:
    branches: ["**"]
    paths:
      - "docs/user/reference/**"
      - ".github/workflows/docs-reference.yml"
  pull_request:
    paths:
      - "docs/user/reference/**"
      - ".github/workflows/docs-reference.yml"

permissions:
  contents: read

concurrency:
  group: docs-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-cpu
      - name: The generated reference equals the code's
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p ignis-server --test user_docs_reference
